# Forward odds capture — the only remaining way to test the residual rule.
#
# Runs four times a day so that the last row before an event is a genuine
# closing price. Every row is written before the fight happens; settlement
# comes later, from results. The ledger is append-only and committed, which is
# the point: a prediction you can revise is not a prediction.
#
# Needs the ODDS_API_KEY secret. Four runs a day is ~120 requests a month,
# inside The Odds API's 500/month free tier.
name: capture
on:
  schedule:
    - cron: "0 2,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger          # never let two runs append at once
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: corpus
        run: python -m mmastat.sources --corpus --no-upcoming

      - name: capture live prices
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m mmastat.ledger capture

      - name: settle finished bouts
        run: python -m mmastat.ledger settle

      - name: commit the ledger
        run: |
          git config user.name "cornerman-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/ledger/
          git diff --staged --quiet || git commit -m "ledger: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
