# Publishes site/ to GitHub Pages.
#
# Enable once by hand: Settings -> Pages -> Source -> "GitHub Actions".
#
# The workflow_run trigger is NOT optional. GitHub deliberately does not fire
# workflows for pushes made with the default GITHUB_TOKEN, to prevent
# recursion — so the refresh job's commit of a new predictions.json never
# triggered a deploy, and the site kept serving whatever was last pushed by
# hand. Listening for the jobs themselves is the fix.
name: pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [refresh, capture]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # ref matters: workflow_run checks out the default branch at the SHA
      # that triggered it, which for a bot commit is the commit before it.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
