name: refresh
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

# Two files uploaded one after the other are two pushes, so two runs start and
# race each other to deploy-pages. GitHub allows only ONE live deployment to
# the github-pages environment, so whichever gets there second fails - which is
# why a manual re-run right afterwards always works: by then nothing else is in
# flight. This serialises them.
#
# cancel-in-progress stays false so a deployment already running is allowed to
# finish. GitHub skips every QUEUED run except the newest, so a three-file
# upload still ends with one deploy carrying the latest state, not three.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m mmastat.sources --corpus --no-upcoming
      - run: python -m mmastat.tests --real --data-only
      - run: python -m mmastat.sources
        continue-on-error: true
      - run: python -m mmastat.upcoming --json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: commit
        run: |
          git config user.name "cornerman-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/upcoming.txt site/ || true
          if ! git diff --staged --quiet; then
            # [skip ci] so the bot's own commit does not trigger a further run
            # on top of the one that is already running.
            git commit -m "refresh [skip ci]"
            for attempt in 1 2 3; do
              if git push; then break; fi
              git pull --rebase --no-edit
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
