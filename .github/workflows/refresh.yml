name: refresh
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: download the UFCStats corpus
        run: python -m mmastat.sources --corpus --no-upcoming

      - name: validation suite on the refreshed corpus
        run: python -m mmastat.tests

      - name: refresh the upcoming card
        continue-on-error: true
        run: python -m mmastat.sources

      # Live moneyline prices. Optional: with no ODDS_API_KEY secret the market
      # panel is simply omitted rather than showing a stale price.
      # Free key at the-odds-api.com (500 requests/month; this uses ~30).
      # Add it under Settings > Secrets and variables > Actions.
      - name: regenerate predictions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m mmastat.upcoming --json

      - name: commit
        run: |
          git config user.name "cornerman-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/upcoming.txt site/predictions.json
          git diff --staged --quiet || git commit -m "refresh: $(date -u +%Y-%m-%d)"
          git push


      - name: commit
        run: |
          git config user.name "cornerman-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/upcoming.txt site/predictions.json site/index.html
          git diff --staged --quiet || git commit -m "refresh: $(date -u +%Y-%m-%d)"
          git push
