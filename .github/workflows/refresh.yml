name: refresh
on:
  schedule:
    - cron: "0 11 * * *"
  # Also on push, so editing site/index.html by hand actually deploys. Folding
  # the Pages deploy into this job fixed the GITHUB_TOKEN trigger problem but
  # left no path from a manual commit to a live site — the page silently stayed
  # on the previous build. No recursion risk: the same GITHUB_TOKEN rule means
  # this job's own commit cannot re-trigger it.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: download the UFCStats corpus
        run: python -m mmastat.sources --corpus --no-upcoming

      - name: validation suite on the refreshed corpus
        run: python -m mmastat.tests

      - name: refresh the upcoming card
        continue-on-error: true
        run: python -m mmastat.sources

      - name: regenerate predictions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m mmastat.upcoming --json

      - name: commit
        run: |
          git config user.name "cornerman-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/upcoming.txt site/
          git diff --staged --quiet || git commit -m "refresh: $(date -u +%Y-%m-%d)"
          git push || echo "nothing to push"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
