name: bonuses
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bonuses
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m mmastat.sources --corpus --no-upcoming
      - run: python -m mmastat.bonuses --budget-min 20
      - run: python -m mmastat.bonus_model
      - name: commit
        run: |
          git config user.name "cornerman-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/wiki/
          if git diff --staged --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "bonus labels"
          for attempt in 1 2 3; do
            if git push; then echo "pushed"; exit 0; fi
            git pull --rebase --no-edit
          done
          echo "could not push"; exit 1
